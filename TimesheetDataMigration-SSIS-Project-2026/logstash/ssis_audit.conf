input {

  # ================================================================
  # Layer 1: Custom ETL AuditLog
  # ================================================================
  jdbc {
    jdbc_driver_library => "C:/ELK/logstash-9.4.3/lib/mssql-jdbc-13.4.0.jre11.jar"
    jdbc_driver_class => "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    jdbc_connection_string => "jdbc:sqlserver://localhost:1433;databaseName=TimesheetTGDB;encrypt=false"
    jdbc_user => "automation_user"
    jdbc_password => "Password@123"

    statement => "
        SELECT
            LogID,
            LogDateTime,
            RunNumber,
            LogSource,
            TaskName,
            LogStatus,
            RowsInserted,
            RowsUpdated,
            RowsDeleted,
            ExecutedBy,
            TargetTable,
            ExecutionDurationMs
        FROM dbo.AuditLog
        WHERE LogID > :sql_last_value
        ORDER BY LogID
    "

    use_column_value => true
    tracking_column => "logid"
    schedule => "*/30 * * * * *"
    last_run_metadata_path => "C:/ELK/logstash-9.4.3/state/ssis_audit.yml"

    add_field => {
      "pipeline" => "audit"
    }
  }


  # ================================================================
  # Layer 2: SSISDB Operation Messages
  # ================================================================
  jdbc {
    jdbc_driver_library => "C:/ELK/logstash-9.4.3/lib/mssql-jdbc-13.4.0.jre11.jar"
    jdbc_driver_class => "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    jdbc_connection_string => "jdbc:sqlserver://localhost:1433;databaseName=SSISDB;encrypt=false"
    jdbc_user => "automation_user"
    jdbc_password => "Password@123"

    statement => "
    SELECT
      operation_message_id,
      operation_id,
      operation_id AS execution_id,
      message_time,
      message_type,
      message
    FROM catalog.operation_messages
    WHERE message_type IN (110,120,130)
    ORDER BY operation_message_id
    "

    use_column_value => true
    tracking_column => "operation_message_id"
    tracking_column_type => "numeric"
    schedule => "*/30 * * * * *"
    last_run_metadata_path => "C:/ELK/logstash-9.4.3/state/ssis_operation_messages.yml"

    add_field => {
      "pipeline" => "ssis_messages"
    }
  }


  # ================================================================
  # Layer 3: SSIS Executions
  # ================================================================
  jdbc {
    jdbc_driver_library => "C:/ELK/logstash-9.4.3/lib/mssql-jdbc-13.4.0.jre11.jar"
    jdbc_driver_class => "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    jdbc_connection_string => "jdbc:sqlserver://localhost:1433;databaseName=SSISDB;encrypt=false"
    jdbc_user => "automation_user"
    jdbc_password => "Password@123"

    statement => "
        SELECT
            execution_id,
            execution_id AS operation_id,
            folder_name,
            project_name,
            package_name,
            environment_name,
            status,
            start_time,
            end_time,
            executed_as_name
        FROM catalog.executions
        WHERE execution_id > :sql_last_value
        ORDER BY execution_id
    "

    use_column_value => true
    tracking_column => "execution_id"
    tracking_column_type => "numeric"
    schedule => "*/30 * * * * *"
    last_run_metadata_path => "C:/ELK/logstash-9.4.3/state/ssis_executions.yml"

    add_field => {
      "pipeline" => "ssis_executions"
    }
  }
}



filter {


  # ================================================================
  # AuditLog Processing
  # ================================================================
  if [pipeline] == "audit" {

    mutate {
      convert => {
        "RowsInserted" => "integer"
        "RowsUpdated" => "integer"
        "RowsDeleted" => "integer"
        "ExecutionDurationMs" => "integer"
        "RunNumber" => "integer"
      }
    }

    date {
      match => ["LogDateTime", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS"]
      target => "@timestamp"
    }
  }



  # ================================================================
  # SSIS Operation Messages Processing
  # ================================================================
  if [pipeline] == "ssis_messages" {

    mutate {
      convert => {
        "operation_message_id" => "integer"
        "operation_id" => "integer"
        "message_type" => "string"
      }
    }


    translate {
      field => "message_type"
      destination => "message_type_name"
      fallback => "Unknown"

      dictionary => {
        "110" => "Warning"
        "120" => "Error"
        "130" => "Information"
      }
    }


    date {
      match => ["message_time", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS"]
      target => "@timestamp"
    }

  }



  # ================================================================
  # SSIS Executions Processing
  # ================================================================
  if [pipeline] == "ssis_executions" {


    mutate {
      convert => {
        "execution_id" => "integer"
        "operation_id" => "integer"
      }
    }


    translate {

      field => "status"

      destination => "status_name"

      fallback => "Unknown Status"

      dictionary => {

        "1" => "Created"
        "2" => "Running"
        "3" => "Canceled"
        "4" => "Failed"
        "5" => "Pending"
        "6" => "Ended Unexpectedly"
        "7" => "Succeeded"
        "8" => "Stopping"
        "9" => "Completed"

      }
    }



    date {
      match => ["start_time", "yyyy-MM-dd HH:mm:ss.SSS", "ISO8601"]
      target => "@timestamp"
    }



    if [start_time] and [end_time] {

      ruby {

        code => "
          require 'time'

          begin

            start_t = Time.parse(event.get('start_time').to_s).to_f
            end_t = Time.parse(event.get('end_time').to_s).to_f

            duration_s = end_t - start_t

            if duration_s >= 0
              event.set('execution_duration_seconds', duration_s)
              event.set('execution_duration_ms', (duration_s * 1000).round)
            end

          rescue => e

            event.set('ruby_error', e.message)

          end
        "

      }

    }

  }

}



