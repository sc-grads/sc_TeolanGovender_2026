name: Teams PR Notifications

on:
  pull_request:
    types: [opened, closed, reopened, ready_for_review]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send message to Teams
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "text": "GitHub PR update in ${{ github.repository }}\n\nTitle: ${{ github.event.pull_request.title }}\nAction: ${{ github.event.action }}\nAuthor: ${{ github.event.pull_request.user.login }}\nURL: ${{ github.event.pull_request.html_url }}"
          }' \
          ${{ secrets.TEAMS_WEBHOOK_URL }}