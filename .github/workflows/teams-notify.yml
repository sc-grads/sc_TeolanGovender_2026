name: Teams PR Notifications

on:
  pull_request:
    types: [opened, closed, reopened, ready_for_review]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send formatted message to Teams
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "@type": "MessageCard",
            "@context": "http://schema.org/extensions",
            "summary": "GitHub Pull Request Update",
            "themeColor": "0078D7",
            "title": "🔔 Pull Request Update",
            "sections": [
              {
                "facts": [
                  {
                    "name": "Repository",
                    "value": "${{ github.repository }}"
                  },
                  {
                    "name": "Action",
                    "value": "${{ github.event.action }}"
                  },
                  {
                    "name": "Title",
                    "value": "${{ github.event.pull_request.title }}"
                  },
                  {
                    "name": "Author",
                    "value": "${{ github.event.pull_request.user.login }}"
                  },
                  {
                    "name": "Branch",
                    "value": "${{ github.event.pull_request.head.ref }} → ${{ github.event.pull_request.base.ref }}"
                  }
                ],
                "markdown": true
              }
            ],
            "potentialAction": [
              {
                "@type": "OpenUri",
                "name": "View Pull Request",
                "targets": [
                  {
                    "os": "default",
                    "uri": "${{ github.event.pull_request.html_url }}"
                  }
                ]
              }
            ]
          }' \
          ${{ secrets.TEAMS_WEBHOOK_URL }}