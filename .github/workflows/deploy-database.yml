name: SQL Database Deployment
 
on:
  workflow_dispatch:
 
  push:
    paths:
      - 'SQL-Project/scripts/**'
 
jobs:
 
# ==================================================
# STAGING DEPLOYMENT
# ==================================================
 
  deploy-staging:
    name: Deploy to Staging
 
    uses: ./.github/workflows/deploy-sql-template.yml
 
    with:
      database: Cloud_Tunnels_TG
      scripts_path: SQL-Project/scripts
      environment_name: staging
 
    secrets:
      sql_username: ${{ secrets.SQL_USERNAME }}
      sql_password: ${{ secrets.SQL_PASSWORD }}
 
# ==================================================
# APPROVAL GATE
# ==================================================
 
  approval:
    name: Production Approval
 
    needs: deploy-staging
 
    if: success()
 
    runs-on: ubuntu-latest
 
    environment:
      name: production
 
    steps:
      - name: Await Approval
        run: |
          echo "Waiting for production approval..."
 
# ==================================================
# PRODUCTION DEPLOYMENT
# ==================================================
 
  deploy-production:
    name: Deploy to Production
 
    needs: approval
 
    if: success()
 
    uses: ./.github/workflows/deploy-sql-template.yml
 
    with:
      database: Cloud_Tunnels_TG
      scripts_path: SQL-Project/scripts
      environment_name: production
 
    secrets:
      sql_username: ${{ secrets.SQL_USERNAME }}
      sql_password: ${{ secrets.SQL_PASSWORD }}
