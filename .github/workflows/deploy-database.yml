        -P "${{ secrets.PARTNER_SQL_PASSWORD }}" `
        -d "${{ env.DB_NAME }}" `
        -i "SQL-Project/scripts/CreateTable.sql"

  # STEP 3 — Create logging table
  - name: Run Partner CreateLoggingTable script
    shell: powershell
    run: |
      sqlcmd `
        -b `
        -S "${{ secrets.PARTNER_SQL_SERVER }},${{ secrets.PARTNER_SQL_PORT }}" `
        -U "${{ secrets.PARTNER_SQL_USERNAME }}" `
        -P "${{ secrets.PARTNER_SQL_PASSWORD }}" `
        -d "${{ env.DB_NAME }}" `
        -i "SQL-Project/scripts/CreateLoggingTable.sql"

  # STEP 4 — Seed data
  - name: Run Partner SeedData script
    shell: powershell
    run: |
      sqlcmd `
        -b `
        -S "${{ secrets.PARTNER_SQL_SERVER }},${{ secrets.PARTNER_SQL_PORT }}" `
        -U "${{ secrets.PARTNER_SQL_USERNAME }}" `
