name: Deploy SQL Database

on:
  workflow_dispatch:
  push:
    paths:
      - 'SQL-Project/scripts/**'

env:
  DB_NAME: Cloud_Tunnels_TG


jobs:

# JOB 1 — STAGING DEPLOYMENT
  deploy-staging:
    name: Deploy to Staging SQL Server
    runs-on: windows-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Database
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -Q "IF DB_ID('${{ env.DB_NAME }}') IS NULL CREATE DATABASE ${{ env.DB_NAME }};"

      - name: Run CreateTable script
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/CreateTable.sql"

      - name: Run CreateLoggingTable script
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/CreateLoggingTable.sql"

      - name: Run SeedData script
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/SeedData.sql"

      - name: Run Execution Log script
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/LogExecution.sql"


# JOB 2 — STAGING NOTIFY
  notify-staging:
    name: Notify Staging Success
    needs: deploy-staging
    runs-on: ubuntu-latest

    steps:
      - name: Time
        id: time
        run: echo "time=$(TZ='Africa/Johannesburg' date '+%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Send Notification
        run: |
          echo "{
            \"@type\":\"MessageCard\",
            \"@context\":\"http://schema.org/extensions\",
            \"themeColor\":\"0078D7\",
            \"title\":\"🟦 Staging Deployment Complete\",
            \"sections\":[
              {
                \"facts\":[
                  {\"name\":\"Repo\",\"value\":\"${{ github.repository }}\"},
                  {\"name\":\"Database\",\"value\":\"${{ env.DB_NAME }}\"},
                  {\"name\":\"Status\",\"value\":\"SUCCESS\"},
                  {\"name\":\"Time\",\"value\":\"${{ steps.time.outputs.time }}\"}
                ]
              }
            ]
          }" > payload.json

      - name: Send to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" -d @payload.json "$TEAMS_WEBHOOK_URL"


# JOB 3 — APPROVAL NOTIFY
  approval-notify:
    name: Notify Production Approval
    needs: notify-staging
    runs-on: ubuntu-latest

    steps:
      - name: Time
        id: time
        run: echo "time=$(TZ='Africa/Johannesburg' date '+%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Send Approval Request
        run: |
          echo "{
            \"@type\":\"MessageCard\",
            \"@context\":\"http://schema.org/extensions\",
            \"themeColor\":\"FFA500\",
            \"title\":\"⚠️ Production Approval Required\",
            \"sections\":[
              {
                \"facts\":[
                  {\"name\":\"Repo\",\"value\":\"${{ github.repository }}\"},
                  {\"name\":\"Triggered By\",\"value\":\"${{ github.actor }}\"},
                  {\"name\":\"Database\",\"value\":\"${{ env.DB_NAME }}\"}
                ]
              }
            ]
          }" > payload.json

      - name: Send to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" -d @payload.json "$TEAMS_WEBHOOK_URL"


# JOB 4 — PRODUCTION GATE
  approval:
    name: Manual Approval
    needs: approval-notify
    runs-on: windows-latest
    environment:
      name: production

    steps:
      - name: Wait for Approval
        run: echo "Waiting for production approval..."


# JOB 5 — PRODUCTION DEPLOY
  deploy-production:
    name: Deploy to Partner SQL Server
    needs: approval
    runs-on: windows-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Database
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ vars.PARTNER_SQL_SERVER }},${{ vars.PARTNER_SQL_PORT }}" `
            -U "${{ secrets.PARTNER_SQL_USERNAME }}" `
            -P "${{ secrets.PARTNER_SQL_PASSWORD }}" `
            -Q "IF DB_ID('${{ env.DB_NAME }}') IS NULL CREATE DATABASE ${{ env.DB_NAME }};"

      - name: Run Scripts
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ vars.PARTNER_SQL_SERVER }},${{ vars.PARTNER_SQL_PORT }}" `
            -U "${{ secrets.PARTNER_SQL_USERNAME }}" `
            -P "${{ secrets.PARTNER_SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/CreateTable.sql"

          sqlcmd `
            -b `
            -S "${{ vars.PARTNER_SQL_SERVER }},${{ vars.PARTNER_SQL_PORT }}" `
            -U "${{ secrets.PARTNER_SQL_USERNAME }}" `
            -P "${{ secrets.PARTNER_SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/CreateLoggingTable.sql"

          sqlcmd `
            -b `
            -S "${{ vars.PARTNER_SQL_SERVER }},${{ vars.PARTNER_SQL_PORT }}" `
            -U "${{ secrets.PARTNER_SQL_USERNAME }}" `
            -P "${{ secrets.PARTNER_SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/SeedData.sql"

          sqlcmd `
            -b `
            -S "${{ vars.PARTNER_SQL_SERVER }},${{ vars.PARTNER_SQL_PORT }}" `
            -U "${{ secrets.PARTNER_SQL_USERNAME }}" `
            -P "${{ secrets.PARTNER_SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/LogExecution.sql"
