name: Deploy SQL Database

on:
  workflow_dispatch:
  push:
    paths:
      - 'SQL-Project/scripts/**'

env:
  DB_NAME: Cloud_Tunnels_TG

jobs:

# =========================
# LOCAL DEPLOYMENT
# =========================
  deploy-local:
    name: Deploy to Local SQL Server
    uses: ./.github/workflows/deploy-sql-template.yml
    environment: Staging
    with:
      server: ${{ vars.SQL_SERVER }}
      port: ${{ vars.SQL_PORT }}
      username: ${{ secrets.SQL_USERNAME }}
      database: ${{ env.DB_NAME }}
      scripts_path: SQL-Project/scripts
    secrets:
      sql_password: ${{ secrets.SQL_PASSWORD }}

# =========================
# LOCAL NOTIFICATION
# =========================
  notify:
    name: Notify Teams (Local Success)
    needs: deploy-local
    runs-on: ubuntu-latest

    steps:
      - name: Get Current Time
        id: time
        run: echo "time=$(TZ='Africa/Johannesburg' date '+%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Send Success Notification
        run: |
          echo "{
            \"@type\":\"MessageCard\",
            \"@context\":\"http://schema.org/extensions\",
            \"themeColor\":\"0078D7\",
            \"title\":\"🗄️ Local Database Deployment Completed\",
            \"summary\":\"Local SQL deployment successful\",
            \"sections\":[
              {
                \"facts\":[
                  {\"name\":\"Repository\",\"value\":\"${{ github.repository }}\"},
                  {\"name\":\"Database\",\"value\":\"${{ env.DB_NAME }}\"},
                  {\"name\":\"Status\",\"value\":\"SUCCESS\"},
                  {\"name\":\"Time\",\"value\":\"${{ steps.time.outputs.time }}\"}
                ]
              }
            ]
          }" > payload.json

      - name: Send to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" -d @payload.json "$TEAMS_WEBHOOK_URL"

# =========================
# APPROVAL NOTIFICATION
# =========================
  approval-notify:
    name: Notify Approval Required
    needs: notify
    runs-on: ubuntu-latest

    steps:
      - name: Get Current Time
        id: time
        run: echo "time=$(TZ='Africa/Johannesburg' date '+%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Send Approval Request
        run: |
          echo "{
            \"@type\":\"MessageCard\",
            \"@context\":\"http://schema.org/extensions\",
            \"themeColor\":\"FFA500\",
            \"title\":\"⚠️ Approval Required for Partner Deployment\",
            \"summary\":\"Manual approval needed\",
            \"sections\":[
              {
                \"facts\":[
                  {\"name\":\"Repository\",\"value\":\"${{ github.repository }}\"},
                  {\"name\":\"Triggered By\",\"value\":\"${{ github.actor }}\"},
                  {\"name\":\"Database\",\"value\":\"${{ env.DB_NAME }}\"},
                  {\"name\":\"Time\",\"value\":\"${{ steps.time.outputs.time }}\"}
                ]
              }
            ],
            \"potentialAction\":[
              {
                \"@type\":\"OpenUri\",
                \"name\":\"🔍 View Workflow Run\",
                \"targets\":[
                  {
                    \"os\":\"default\",
                    \"uri\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                  }
                ]
              }
            ]
          }" > payload.json

      - name: Send to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" -d @payload.json "$TEAMS_WEBHOOK_URL"

# =========================
# APPROVAL GATE
# =========================
  approval:
    name: Manual Approval
    needs: approval-notify
    runs-on: windows-latest
    environment:
      name: production

    steps:
      - name: Await Approval
        run: echo "Waiting for approval..."

# =========================
# PARTNER DEPLOYMENT
# =========================
  deploy-partner:
    name: Deploy to Accountability Partner
    needs: approval
    uses: ./.github/workflows/deploy-sql-template.yml
    environment: production
    with:
      server: ${{ vars.PARTNER_SQL_SERVER }}
      port: ${{ vars.PARTNER_SQL_PORT }}
      username: ${{ secrets.PARTNER_SQL_USERNAME }}
      database: ${{ env.DB_NAME }}
      scripts_path: SQL-Project/scripts
    secrets:
      sql_password: ${{ secrets.PARTNER_SQL_PASSWORD }}

# =========================
# PARTNER NOTIFICATION
# =========================
  partner-notify:
    name: Notify Partner Deployment Success
    needs: deploy-partner
    runs-on: ubuntu-latest

    steps:
      - name: Get Current Time
        id: time
        run: echo "time=$(TZ='Africa/Johannesburg' date '+%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Send Success Notification
        run: |
          echo "{
            \"@type\":\"MessageCard\",
            \"@context\":\"http://schema.org/extensions\",
            \"themeColor\":\"28A745\",
            \"title\":\"🎉 Partner Deployment Successful\",
            \"summary\":\"Remote deployment complete\",
            \"sections\":[
              {
                \"facts\":[
                  {\"name\":\"Repository\",\"value\":\"${{ github.repository }}\"},
                  {\"name\":\"Database\",\"value\":\"${{ env.DB_NAME }}\"},
                  {\"name\":\"Status\",\"value\":\"SUCCESS\"},
                  {\"name\":\"Time\",\"value\":\"${{ steps.time.outputs.time }}\"}
                ]
              }
            ]
          }" > payload.json

      - name: Send to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" -d @payload.json "$TEAMS_WEBHOOK_URL"
