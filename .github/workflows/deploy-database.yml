name: Deploy SQL Database

on:
workflow_dispatch:

push:
paths:
- 'SQL-Project/scripts/**'

jobs:

# JOB 1 — DEPLOY TO LOCAL SQL SERVER

deploy-local:
name: Deploy to Local SQL Server
runs-on: windows-latest

```
env:
  DB_NAME: Cloud_Tunnels_TG

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  # STEP 1 — Ensure database exists
  - name: Create Database
    shell: powershell
    run: |
      sqlcmd `
        -b `
        -S "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}" `
        -U "${{ secrets.SQL_USERNAME }}" `
        -P "${{ secrets.SQL_PASSWORD }}" `
        -i "SQL-Project/scripts/CreateDatabase.sql"

  # STEP 2 — Create base table
  - name: Run CreateTable script
    shell: powershell
    run: |
      sqlcmd `
        -b `
        -S "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}" `
        -U "${{ secrets.SQL_USERNAME }}" `
        -P "${{ secrets.SQL_PASSWORD }}" `
        -d "${{ env.DB_NAME }}" `
        -i "SQL-Project/scripts/CreateTable.sql"

  # STEP 3 — Create logging table
  - name: Run CreateLoggingTable script
    shell: powershell
    run: |
      sqlcmd `
        -b `
        -S "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}" `
        -U "${{ secrets.SQL_USERNAME }}" `
        -P "${{ secrets.SQL_PASSWORD }}" `
        -d "${{ env.DB_NAME }}" `
        -i "SQL-Project/scripts/CreateLoggingTable.sql"

  # STEP 4 — Seed data
  - name: Run SeedData script
    shell: powershell
    run: |
      sqlcmd `
        -b `
        -S "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}" `
        -U "${{ secrets.SQL_USERNAME }}" `
        -P "${{ secrets.SQL_PASSWORD }}" `
        -d "${{ env.DB_NAME }}" `
        -i "SQL-Project/scripts/SeedData.sql"

  # STEP 5 — Log execution
  - name: Run Execution Log script
    shell: powershell
    run: |
      sqlcmd `
        -b `
        -S "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}" `
        -U "${{ secrets.SQL_USERNAME }}" `
        -P "${{ secrets.SQL_PASSWORD }}" `
        -d "${{ env.DB_NAME }}" `
        -i "SQL-Project/scripts/LogExecution.sql"

  - name: Local Deployment Complete
    run: |
      echo "Successfully deployed to local SQL Server."
```

# JOB 2 — SEND TEAMS NOTIFICATION

notify:
name: Notify Teams
needs: deploy-local
runs-on: windows-latest

```
steps:
  - name: Send Teams Notification
    shell: powershell
    run: |
      $body = @{
        text = "Local database deployment completed successfully. Approval is required before deploying to the accountability partner SQL Server."
      } | ConvertTo-Json

      Invoke-RestMethod `
        -Method Post `
        -ContentType 'Application/Json' `
        -Body $body `
        -Uri "${{ secrets.TEAMS_WEBHOOK_URL }}"
```

# ==========================================

# JOB 3 — MANUAL APPROVAL

# ==========================================

approval:
name: Manual Approval
needs: notify
runs-on: windows-latest

```
environment:
  name: production

steps:
  - name: Await Approval
    run: |
      echo "Waiting for manual approval before partner deployment."
```

# ==========================================

# JOB 4 — DEPLOY TO PARTNER SQL SERVER

# ==========================================

deploy-partner:
name: Deploy to Accountability Partner
needs: approval
runs-on: windows-latest

```
env:
  DB_NAME: Cloud_Tunnels_TG

