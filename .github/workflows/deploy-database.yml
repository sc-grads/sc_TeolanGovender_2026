name: Deploy SQL Database

on:
  workflow_dispatch:
  push:
    paths:
      - 'SQL-Project/scripts/**'

env:
  DB_NAME: Cloud_Tunnels_TG


jobs:

# JOB 1 — STAGING DEPLOYMENT
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: windows-latest

    environment:
      name: Staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Database
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -Q "IF DB_ID('${{ env.DB_NAME }}') IS NULL CREATE DATABASE ${{ env.DB_NAME }};"

      - name: Run CreateTable script
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/CreateTable.sql"

      - name: Run CreateLoggingTable script
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/CreateLoggingTable.sql"

      - name: Run SeedData script
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/SeedData.sql"

      - name: Run Execution Log script
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/LogExecution.sql"


# JOB 2 — STAGING SUCCESS NOTIFICATION
  notify:
    name: Notify Teams (Staging Success)
    needs: deploy-staging
    runs-on: ubuntu-latest

    steps:
      - name: Get Current Time
        id: time
        run: echo "time=$(TZ='Africa/Johannesburg' date '+%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Send Success Notification
        run: |
          echo "{
            \"@type\":\"MessageCard\",
            \"@context\":\"http://schema.org/extensions\",
            \"themeColor\":\"0078D7\",
            \"title\":\"Deployment To Local Server Completed\",
            \"summary\":\"Staging SQL deployment successful\",
            \"sections\":[
              {
                \"facts\":[
                  {\"name\":\"Repository\",\"value\":\"${{ github.repository }}\"},
                  {\"name\":\"Database\",\"value\":\"${{ env.DB_NAME }}\"},
                  {\"name\":\"Status\",\"value\":\"SUCCESS\"},
                  {\"name\":\"Time\",\"value\":\"${{ steps.time.outputs.time }}\"}
                ]
              }
            ]
          }" > payload.json

      - name: Send to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" -d @payload.json "$TEAMS_WEBHOOK_URL"


# JOB 3 — APPROVAL NOTIFICATION
  approval-notify:
    name: Notify Approval Required
    needs: notify
    runs-on: ubuntu-latest

    steps:
      - name: Get Current Time
        id: time
        run: echo "time=$(TZ='Africa/Johannesburg' date '+%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Send Approval Request
        run: |
          echo "{
            \"@type\":\"MessageCard\",
            \"@context\":\"http://schema.org/extensions\",
            \"themeColor\":\"FFA500\",
            \"title\":\"Production Approval Required\",
            \"summary\":\"Manual approval needed before partner deploy\",
            \"sections\":[
              {
                \"facts\":[
                  {\"name\":\"Repository\",\"value\":\"${{ github.repository }}\"},
                  {\"name\":\"Triggered By\",\"value\":\"${{ github.actor }}\"},
                  {\"name\":\"Database\",\"value\":\"${{ env.DB_NAME }}\"},
                  {\"name\":\"Time\",\"value\":\"${{ steps.time.outputs.time }}\"}
                ]
              }
            ],
            \"potentialAction\":[
              {
                \"@type\":\"OpenUri\",
                \"name\":\"View Workflow Run\",
                \"targets\":[
                  {
                    \"os\":\"default\",
                    \"uri\":\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                  }
                ]
              }
            ]
          }" > payload.json

      - name: Send to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" -d @payload.json "$TEAMS_WEBHOOK_URL"


# JOB 4 — MANUAL APPROVAL GATE (PRODUCTION ENVIRONMENT)
  approval:
    name: Manual Approval
    needs: approval-notify
    runs-on: windows-latest

    environment:
      name: production


# JOB 5 — PARTNER DEPLOYMENT (PRODUCTION)
  deploy-partner:
    name: Deploy to Accountability Partner
    needs: approval
    runs-on: windows-latest

    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Partner Database
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ vars.PARTNER_SQL_SERVER }},${{ vars.PARTNER_SQL_PORT }}" `
            -U "${{ secrets.PARTNER_SQL_USERNAME }}" `
            -P "${{ secrets.PARTNER_SQL_PASSWORD }}" `
            -Q "IF DB_ID('${{ env.DB_NAME }}') IS NULL CREATE DATABASE ${{ env.DB_NAME }};"

      - name: Run Partner Scripts
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ vars.PARTNER_SQL_SERVER }},${{ vars.PARTNER_SQL_PORT }}" `
            -U "${{ secrets.PARTNER_SQL_USERNAME }}" `
            -P "${{ secrets.PARTNER_SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/CreateTable.sql"

          sqlcmd `
            -b `
            -S "${{ vars.PARTNER_SQL_SERVER }},${{ vars.PARTNER_SQL_PORT }}" `
            -U "${{ secrets.PARTNER_SQL_USERNAME }}" `
            -P "${{ secrets.PARTNER_SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/CreateLoggingTable.sql"

          sqlcmd `
            -b `
            -S "${{ vars.PARTNER_SQL_SERVER }},${{ vars.PARTNER_SQL_PORT }}" `
            -U "${{ secrets.PARTNER_SQL_USERNAME }}" `
            -P "${{ secrets.PARTNER_SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/SeedData.sql"

          sqlcmd `
            -b `
            -S "${{ vars.PARTNER_SQL_SERVER }},${{ vars.PARTNER_SQL_PORT }}" `
            -U "${{ secrets.PARTNER_SQL_USERNAME }}" `
            -P "${{ secrets.PARTNER_SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/LogExecution.sql"


# JOB 6 — PARTNER SUCCESS NOTIFICATION
  partner-notify:
    name: Notify Partner Deployment Success
    needs: deploy-partner
    runs-on: ubuntu-latest

    steps:
      - name: Get Current Time
        id: time
        run: echo "time=$(TZ='Africa/Johannesburg' date '+%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Send Success Notification
        run: |
          echo "{
            \"@type\":\"MessageCard\",
            \"@context\":\"http://schema.org/extensions\",
            \"themeColor\":\"28A745\",
            \"title\":\"Partner Deployment Successful\",
            \"summary\":\"Remote deployment complete\",
            \"sections\":[
              {
                \"facts\":[
                  {\"name\":\"Repository\",\"value\":\"${{ github.repository }}\"},
                  {\"name\":\"Database\",\"value\":\"${{ env.DB_NAME }}\"},
                  {\"name\":\"Status\",\"value\":\"SUCCESS\"},
                  {\"name\":\"Time\",\"value\":\"${{ steps.time.outputs.time }}\"}
                ]
              }
            ]
          }" > payload.json

      - name: Send to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" -d @payload.json "$TEAMS_WEBHOOK_URL"
