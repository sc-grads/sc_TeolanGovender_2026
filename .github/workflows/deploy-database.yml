name: Deploy SQL Database

on:
  workflow_dispatch:

  push:
    paths:
      - 'SQL-Project/scripts/**'

jobs:

  deploy-local:
    name: Deploy to Local SQL Server
    runs-on: windows-latest

    env:
      DB_NAME: Cloud_Tunnels_TG

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Database
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -i "SQL-Project/scripts/CreateDatabase.sql"

      - name: Run CreateTable script
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/CreateTable.sql"

      - name: Run CreateLoggingTable script
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/CreateLoggingTable.sql"

      - name: Run SeedData script
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/SeedData.sql"

      - name: Run Execution Log script
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ secrets.SQL_SERVER }},${{ secrets.SQL_PORT }}" `
            -U "${{ secrets.SQL_USERNAME }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/LogExecution.sql"

      - name: Local Deployment Complete
        run: echo "Successfully deployed to local SQL Server."


  notify:
    name: Notify Teams
    needs: deploy-local
    runs-on: windows-latest

    steps:
      - name: Send Teams Notification
        shell: bash
        run: |
          curl -X POST \
          -H "Content-Type: application/json" \
          -d '{
            "text": "🚀 Local SQL deployment completed successfully. Approval required for partner deployment."
          }' \
          "${{ secrets.TEAMS_WEBHOOK_URL }}"


  approval:
    name: Manual Approval
    needs: notify
    runs-on: windows-latest

    environment:
      name: production

    steps:
      - name: Await Approval
        run: echo "Waiting for manual approval before partner deployment."


  deploy-partner:
    name: Deploy to Accountability Partner
    needs: approval
    runs-on: windows-latest

    env:
      DB_NAME: Cloud_Tunnels_TG

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Partner Database
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ secrets.PARTNER_SQL_SERVER }},${{ secrets.PARTNER_SQL_PORT }}" `
            -U "${{ secrets.PARTNER_SQL_USERNAME }}" `
            -P "${{ secrets.PARTNER_SQL_PASSWORD }}" `
            -i "SQL-Project/scripts/CreateDatabase.sql"

      - name: Run Partner CreateTable script
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ secrets.PARTNER_SQL_SERVER }},${{ secrets.PARTNER_SQL_PORT }}" `
            -U "${{ secrets.PARTNER_SQL_USERNAME }}" `
            -P "${{ secrets.PARTNER_SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/CreateTable.sql"

      - name: Run Partner CreateLoggingTable script
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ secrets.PARTNER_SQL_SERVER }},${{ secrets.PARTNER_SQL_PORT }}" `
            -U "${{ secrets.PARTNER_SQL_USERNAME }}" `
            -P "${{ secrets.PARTNER_SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/CreateLoggingTable.sql"

      - name: Run Partner SeedData script
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ secrets.PARTNER_SQL_SERVER }},${{ secrets.PARTNER_SQL_PORT }}" `
            -U "${{ secrets.PARTNER_SQL_USERNAME }}" `
            -P "${{ secrets.PARTNER_SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/SeedData.sql"

      - name: Run Partner LogExecution script
        shell: powershell
        run: |
          sqlcmd `
            -b `
            -S "${{ secrets.PARTNER_SQL_SERVER }},${{ secrets.PARTNER_SQL_PORT }}" `
            -U "${{ secrets.PARTNER_SQL_USERNAME }}" `
            -P "${{ secrets.PARTNER_SQL_PASSWORD }}" `
            -d "${{ env.DB_NAME }}" `
            -i "SQL-Project/scripts/LogExecution.sql"

      - name: Partner Deployment Complete
        run: echo "Successfully deployed to accountability partner SQL Server."
