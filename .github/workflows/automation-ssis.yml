name: Deploy My SSIS Package To Both PCs

on:
  workflow_dispatch:

  push:
    branches:
      - master

jobs:
  deploy-to-partner-pc:
    name: Deploy to Partner PC via Ngrok Tunnel
    runs-on: windows-latest
    environment: staging

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Run Pre-Flight Create Database Script
        run: |
          sqlcmd -S "${{ vars.SQL_SERVER }}" -U "${{ secrets.SQL_USERNAME }}" -P "${{ secrets.SQL_PASSWORD }}" -i "DatabaseAdministration/Mastering-SSIS/Resources/SSISDemos/SSISDemos/DeploymentDemo/CreateDatabase.sql" -b
        shell: pwsh

      - name: 2. Deploy Database Schema Tables
        run: |
          sqlcmd -S "${{ vars.SQL_SERVER }}" -U "${{ secrets.SQL_USERNAME }}" -P "${{ secrets.SQL_PASSWORD }}" -d TimesheetDb_tg -i "DatabaseAdministration/Mastering-SSIS/Resources/SSISDemos/SSISDemos/DeploymentDemo/CreateTables.sql" -b
        shell: pwsh

      - name: 3. Deploy Database Indexes
        run: |
          sqlcmd -S "${{ vars.SQL_SERVER }}" -U "${{ secrets.SQL_USERNAME }}" -P "${{ secrets.SQL_PASSWORD }}" -d TimesheetDb_tg -i "DatabaseAdministration/Mastering-SSIS/Resources/SSISDemos/SSISDemos/DeploymentDemo/CreateIndexes.sql" -b
        shell: pwsh

      - name: 4. Deploy Stored Procedures (Table Dependency Safe)
        run: |
          sqlcmd -S "${{ vars.SQL_SERVER }}" -U "${{ secrets.SQL_USERNAME }}" -P "${{ secrets.SQL_PASSWORD }}" -d TimesheetDb_tg -i "DatabaseAdministration/Mastering-SSIS/Resources/SSISDemos/SSISDemos/DeploymentDemo/CreateStoredProcedures.sql" -b
        shell: pwsh