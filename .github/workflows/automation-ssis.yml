name: Deploy My SSIS Package To Both PCs

on:
  push:
    branches:
      - master

jobs:
  deploy-to-partner-pc:
    name: Deploy to Partner PC via Ngrok Tunnel
    runs-on: windows-latest
    environment: staging

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Run Pre-Flight Create Database Script
        run: |
          sqlcmd -S "${{ vars.SQL_SERVER }}" -U "${{ secrets.SQL_USERNAME }}" -P "${{ secrets.SQL_PASSWORD }}" -i "SSIS-Project/Scripts/CreateDatabase.sql" -b
        shell: pwsh

      - name: 2. Deploy Database Schema Tables
        run: |
          sqlcmd -S "${{ vars.SQL_SERVER }}" -U "${{ secrets.SQL_USERNAME }}" -P "${{ secrets.SQL_PASSWORD }}" -d TimesheetDb_tg -i "SSIS-Project/Scripts/CreateTables.sql" -b
        shell: pwsh

      - name: 3. Deploy Database Indexes
        run: |
          sqlcmd -S "${{ vars.SQL_SERVER }}" -U "${{ secrets.SQL_USERNAME }}" -P "${{ secrets.SQL_PASSWORD }}" -d TimesheetDb_tg -i "SSIS-Project/Scripts/CreateIndexes.sql" -b
        shell: pwsh

      - name: 4. Deploy Stored Procedures (Table Dependency Safe)
        run: |
          sqlcmd -S "${{ vars.SQL_SERVER }}" -U "${{ secrets.SQL_USERNAME }}" -P "${{ secrets.SQL_PASSWORD }}" -d TimesheetDb_tg -i "SSIS-Project/Scripts/CreateStoredProcedure.sql" -b
        shell: pwsh

      - name: 5. Locate Visual Studio DevEnv Tool
        run: |
          # Dynamically finds the pre-installed Visual Studio instance on the cloud runner
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath
          if (-not $vsPath) { $vsPath = & "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath }
          $devenvCom = Join-Path (Split-Path $vsPath) "devenv.com"
          echo "DEVENV_PATH=$devenvCom" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      - name: 6. Build SSIS Project to ISPAC via DevEnv
        run: |
          & "${{ env.DEVENV_PATH }}" "SSIS-Project\TimesheetIntegrationTestTwo\TimesheetIntegrationTestTwo\TimesheetIntegrationTestTwo.dtproj" /Build "Development"
        shell: pwsh

      - name: 7. Deploy ISPAC to Partner SSISDB Catalog
        run: |
          Write-Host "Streaming Compiled ISPAC to temporary SQL file..."
          
          # 1. Read the binary artifact
          $ispacPath = "SSIS-Project/TimesheetIntegrationTestTwo/TimesheetIntegrationTestTwo/bin/Development/TimesheetIntegrationTestTwo.ispac"
          $fileBytes = [System.IO.File]::ReadAllBytes($ispacPath)
          $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")
          
          # 2. Build the query text dynamically
          $deployQuery = @"
          SET NOCOUNT ON;
          IF NOT EXISTS (SELECT 1 FROM [SSISDB].[catalog].[folders] WHERE name = 'PracticeActivities') 
          BEGIN 
              EXEC [SSISDB].[catalog].[create_folder] @folder_name = 'PracticeActivities'; 
          END
          
          DECLARE @project_binary VARBINARY(MAX) = $hexString;
          EXEC [SSISDB].[catalog].[deploy_project] @folder_name = 'PracticeActivities', @project_name = 'TimesheetIntegrationTestTwo', @project_stream = @project_binary;
          "@
          
          # 3. Dump the heavy payload safely into a physical file on the runner disk
          $tempSqlFile = Join-Path $env:RUNNER_TEMP "RunDeploy.sql"
          $deployQuery | Out-File -FilePath $tempSqlFile -Encoding utf8 -Force
          
          Write-Host "Executing deployment payload from input file over the tunnel..."
          # 4. Use the input file parameter (-i) to completely bypass command-line buffer limits
          sqlcmd -S "${{ vars.SQL_SERVER }}" -U "${{ secrets.SQL_USERNAME }}" -P "${{ secrets.SQL_PASSWORD }}" -i $tempSqlFile -b
        shell: pwsh