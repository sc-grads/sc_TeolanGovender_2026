name: Timesheet Database Deployment

on:
  workflow_dispatch:
    inputs:
      target_pc:
        description: 'Select Target Machine'
        required: true
        default: 'tg-pc'
        type: choice
        options:
          - 'tg-pc'
          - 'cm-pc'
          - 'both'

  push:
    paths:
      - 'SSIS-Project/Timesheets/**'
      - 'SSIS-Project/Scripts/**'

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo 'matrix=["tg-pc", "cm-pc"]' >> $GITHUB_OUTPUT
          else
            if [ "${{ github.event.inputs.target_pc }}" = "both" ]; then
              echo 'matrix=["tg-pc", "cm-pc"]' >> $GITHUB_OUTPUT
            else
              echo 'matrix=["${{ github.event.inputs.target_pc }}"]' >> $GITHUB_OUTPUT
            fi
          fi

  deploy:
    needs: set-matrix
    strategy:
      matrix:
        target: ${{ fromJson(needs.set-matrix.outputs.targets) }}
    uses: ./.github/workflows/deploy-timesheet-template.yml
    with:
      database: TimesheetDb_tg
      runner_label: runner-${{ matrix.target }}
    secrets:
      sql_username: ${{ secrets.SQL_USERNAME }}
      sql_password: ${{ secrets.SQL_PASSWORD }}