name: Timesheet Database Deployment

on:
  workflow_dispatch:
  push:
    paths:
      - 'SQL-Project/scripts/**'

jobs:
# STAGING DEPLOYMENT
  deploy-staging:
    name: Deploy to Staging
    uses: ./.github/workflows/deploy-timesheet-template.yml
    with:
      database: TimesheetDb
      #scripts_path: SQL-Project/scripts
      environment_name: staging
    secrets:
      sql_username: ${{ secrets.SQL_USERNAME }}
      sql_password: ${{ secrets.SQL_PASSWORD }}

# STAGING NOTIFICATION
  staging-notify:
    name: Notify Staging Success
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Get Current Time
        id: time
        run: echo "time=$(TZ='Africa/Johannesburg' date '+%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: Send Staging Success Notification
        run: |
          echo "{
            \"@type\":\"MessageCard\",
            \"@context\":\"http://schema.org/extensions\",
            \"themeColor\":\"0078D7\",
            \"title\":\"Timesheet Integration - Staging Run Successful\",
            \"summary\":\"Staging SSIS package triggered\",
            \"sections\":[
              {
                \"facts\":[
                  {\"name\":\"Repository\",\"value\":\"${{ github.repository }}\"},
                  {\"name\":\"Database\",\"value\":\"TimesheetDb\"},
                  {\"name\":\"Environment\",\"value\":\"Staging\"},
                  {\"name\":\"Status\",\"value\":\"SSIS EXECUTION COMMAND SENT\"},
                  {\"name\":\"Time\",\"value\":\"${{ steps.time.outputs.time }}\"}
                ]
              }
            ]
          }" > payload.json

      - name: Send to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          curl -X POST -H "Content-Type: application/json" -d @payload.json "$TEAMS_WEBHOOK_URL"