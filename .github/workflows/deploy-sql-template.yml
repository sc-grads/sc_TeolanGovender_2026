name: Reusable SQL Deploy

on:
  workflow_call:
    inputs:
      server:
        required: true
        type: string

      port:
        required: true
        type: string

      database:
        required: true
        type: string

      scripts_path:
        required: true
        type: string

      environment_name:
        required: true
        type: string


jobs:
  deploy:
    runs-on: windows-latest

    environment:
      name: ${{ inputs.environment_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Inputs
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ inputs.server }}")) { throw "SERVER is empty" }
          if ([string]::IsNullOrWhiteSpace("${{ inputs.port }}")) { throw "PORT is empty" }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.SQL_USERNAME }}")) { throw "USERNAME is empty" }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.SQL_PASSWORD }}")) { throw "PASSWORD is empty" }

      - name: Create Database
        shell: powershell
        run: |
          $server = "${{ inputs.server }},${{ inputs.port }}"
          $user = "${{ secrets.SQL_USERNAME }}"
          $pass = "${{ secrets.SQL_PASSWORD }}"
          $db = "${{ inputs.database }}"

          sqlcmd `
            -b `
            -S $server `
            -U $user `
            -P $pass `
            -Q "IF DB_ID('$db') IS NULL CREATE DATABASE [$db];"

      - name: Run SQL Scripts
        shell: powershell
        run: |
          $server = "${{ inputs.server }},${{ inputs.port }}"
          $user = "${{ secrets.SQL_USERNAME }}"
          $pass = "${{ secrets.SQL_PASSWORD }}"
          $db = "${{ inputs.database }}"
          $path = "${{ inputs.scripts_path }}"

          sqlcmd -b -S $server -U $user -P $pass -d $db -i "$path/CreateTable.sql"
          sqlcmd -b -S $server -U $user -P $pass -d $db -i "$path/CreateLoggingTable.sql"
          sqlcmd -b -S $server -U $user -P $pass -d $db -i "$path/SeedData.sql"
          sqlcmd -b -S $server -U $user -P $pass -d $db -i "$path/LogExecution.sql"
