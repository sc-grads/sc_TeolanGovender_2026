name: Reusable SQL Deploy
 
on:
  workflow_call:
    inputs:
      database:
        required: true
        type: string
 
      scripts_path:
        required: true
        type: string
 
      environment_name:
        required: true
        type: string
 
    secrets:
      sql_username:
        required: true
 
      sql_password:
        required: true
 
jobs:
  deploy:
    name: Deploy Database
    runs-on: windows-latest
 
    environment:
      name: ${{ inputs.environment_name }}
 
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
 
      - name: Validate Configuration
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ vars.SQL_SERVER }}")) {
            throw "SQL_SERVER is not configured"
          }
 
          if ([string]::IsNullOrWhiteSpace("${{ vars.SQL_PORT }}")) {
            throw "SQL_PORT is not configured"
          }
 
          if ([string]::IsNullOrWhiteSpace("${{ secrets.sql_username }}")) {
            throw "SQL_USERNAME is not configured"
          }
 
          if ([string]::IsNullOrWhiteSpace("${{ secrets.sql_password }}")) {
            throw "SQL_PASSWORD is not configured"
          }
 
      - name: Display Deployment Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "SQL Deployment Starting"
          Write-Host "Environment : ${{ inputs.environment_name }}"
          Write-Host "Server      : ${{ vars.SQL_SERVER }}"
          Write-Host "Port        : ${{ vars.SQL_PORT }}"
          Write-Host "Database    : ${{ inputs.database }}"
          Write-Host "========================================"
          Write-Host ""
 
      - name: Create Database If Missing
        shell: powershell
        run: |
          $server = "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}"
          $user   = "${{ secrets.sql_username }}"
          $pass   = "${{ secrets.sql_password }}"
          $db     = "${{ inputs.database }}"
 
          sqlcmd -b `
            -S $server `
            -U $user `
            -P $pass `
            -Q "IF DB_ID('$db') IS NULL CREATE DATABASE [$db];"
 
      - name: Execute SQL Scripts
        shell: powershell
        run: |
          $server = "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}"
          $user   = "${{ secrets.sql_username }}"
          $pass   = "${{ secrets.sql_password }}"
          $db     = "${{ inputs.database }}"
          $path   = "${{ inputs.scripts_path }}"
 
          sqlcmd -b -S $server -U $user -P $pass -d $db -i "$path/CreateTable.sql"
          sqlcmd -b -S $server -U $user -P $pass -d $db -i "$path/CreateLoggingTable.sql"
          sqlcmd -b -S $server -U $user -P $pass -d $db -i "$path/SeedData.sql"
          sqlcmd -b -S $server -U $user -P $pass -d $db -i "$path/LogExecution.sql"
 
      - name: Deployment Successful
        if: success()
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========================================"
          Write-Host "DEPLOYMENT SUCCESSFUL"
          Write-Host "Environment : ${{ inputs.environment_name }}"
          Write-Host "Database    : ${{ inputs.database }}"
          Write-Host "========================================"
          Write-Host ""
