name: Reusable SQL Deploy

on:
  workflow_call:
    inputs:
      server:
        required: true
        type: string
      port:
        required: true
        type: string
      username:
        required: true
        type: string
      database:
        required: true
        type: string
      scripts_path:
        required: true
        type: string

    secrets:
      sql_password:
        required: true

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      # CREATE DATABASE
      - name: Create Database
        shell: powershell
        run: |
          $server = "${{ inputs.server }}"
          $port = "${{ inputs.port }}"
          $user = "${{ inputs.username }}"
          $pass = "${{ secrets.sql_password }}"
          $db = "${{ inputs.database }}"

          if ([string]::IsNullOrWhiteSpace($server) -or
              [string]::IsNullOrWhiteSpace($port) -or
              [string]::IsNullOrWhiteSpace($user) -or
              [string]::IsNullOrWhiteSpace($pass)) {
              throw "Missing required SQL connection inputs"
          }

          sqlcmd -b `
            -S "$server,$port" `
            -U "$user" `
            -P "$pass" `
            -Q "IF DB_ID('$db') IS NULL CREATE DATABASE $db;"


      # RUN SCRIPTS
      - name: Run SQL Scripts
        shell: powershell
        run: |
          $server = "${{ inputs.server }}"
          $port = "${{ inputs.port }}"
          $user = "${{ inputs.username }}"
          $pass = "${{ secrets.sql_password }}"
          $db = "${{ inputs.database }}"
          $path = "${{ inputs.scripts_path }}"

          sqlcmd -b -S "$server,$port" -U "$user" -P "$pass" -d "$db" -i "$path/CreateTable.sql"

          sqlcmd -b -S "$server,$port" -U "$user" -P "$pass" -d "$db" -i "$path/CreateLoggingTable.sql"

          sqlcmd -b -S "$server,$port" -U "$user" -P "$pass" -d "$db" -i "$path/SeedData.sql"

          sqlcmd -b -S "$server,$port" -U "$user" -P "$pass" -d "$db" -i "$path/LogExecution.sql"
