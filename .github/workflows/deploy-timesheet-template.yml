name: Reusable timesheet Deploy
 
on:
  workflow_call:
    inputs:
      database:
        required: true
        type: string
      environment_name:
        required: true
        type: string
    secrets:
      sql_username:
        required: true
      sql_password:
        required: true
 
jobs:
  deploy:
    name: Deploy Timesheet Database
    runs-on: windows-latest
 
    environment:
      name: ${{ inputs.environment_name }}
 
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
 
      - name: Validate Configuration
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ vars.SQL_SERVER }}")) { throw "SQL_SERVER is not configured" }
          if ([string]::IsNullOrWhiteSpace("${{ vars.SQL_PORT }}")) { throw "SQL_PORT is not configured" }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.sql_username }}")) { throw "SQL_USERNAME is not configured" }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.sql_password }}")) { throw "SQL_PASSWORD is not configured" }
 
      - name: Run Pre-Flight Database Scripts
        shell: powershell
        run: |
          $server = "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}"
          $user   = "${{ secrets.sql_username }}"
          $pass   = "${{ secrets.sql_password }}"
          $db     = "${{ inputs.database }}"
          
          # Exact sequential list of pre-flight SQL files
          $sqlFiles = @(
            "CreateDatabase.sql",
            "CreateTables.sql",
            "CreateIndexes.sql",
            "CreateStoredProcedure.sql"
          )

          Write-Host "Starting Pre-Flight Database Executions..."
          
          foreach ($file in $sqlFiles) {
            $filePath = "SSIS-Project\Scripts\$file"
            if (Test-Path $filePath) {
              Write-Host "Executing: $file"
              # -b forces sqlcmd to exit and fail the step if a SQL script raises an error
              sqlcmd -b -S $server -U $user -P $pass -d $db -i $filePath
            } else {
              throw "Critical pre-flight file missing from workspace: $filePath"
            }
          }
          Write-Host "Pre-flight checks passed successfully."

      - name: Trigger Remote SSIS Package Job
        shell: powershell
        run: |
          $server = "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}"
          $user   = "${{ secrets.sql_username }}"
          $pass   = "${{ secrets.sql_password }}"
 
          Write-Host "Triggering Remote SSIS Automation via Agent..."
          sqlcmd -b `
            -S $server `
            -U $user `
            -P $pass `
            -d "msdb" `
            -Q "EXEC dbo.sp_start_job @job_name = 'Run_Timesheet_Package';"
 
      - name: Deployment Successful
        if: success()
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "PRE-FLIGHT AND SSIS EXECUTION SIGNAL COMPLETED"
          Write-Host "Environment : ${{ inputs.environment_name }}"
          Write-Host "========================================"