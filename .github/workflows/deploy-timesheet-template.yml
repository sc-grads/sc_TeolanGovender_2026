name: Reusable timesheet Deploy
 
on:
  workflow_call:
    inputs:
      database:
        required: true
        type: string
      environment_name:
        required: true
        type: string
    secrets:
      sql_username:
        required: true
      sql_password:
        required: true
 
jobs:
  deploy:
    name: Deploy Timesheet Database
    runs-on: windows-latest
 
    environment:
      name: ${{ inputs.environment_name }}
 
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
 
      - name: Validate Configuration
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ vars.SQL_SERVER }}")) { throw "SQL_SERVER is not configured" }
          if ([string]::IsNullOrWhiteSpace("${{ vars.SQL_PORT }}")) { throw "SQL_PORT is not configured" }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.sql_username }}")) { throw "SQL_USERNAME is not configured" }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.sql_password }}")) { throw "SQL_PASSWORD is not configured" }

      - name: 1. Initialize SSISDB Catalog
        shell: powershell
        run: |
          $server = "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}"
          $user   = "${{ secrets.sql_username }}"
          $pass   = "${{ secrets.sql_password }}"

          # T-SQL to enable CLR and create SSISDB if missing (Skipping folder creation to avoid SQL Auth block)
          $setupSql = @"
          SET NOCOUNT ON;

          -- 1. Enable CLR Engine (Prerequisite for hosting SSISDB features)
          IF (SELECT value_in_use FROM sys.configurations WHERE name = 'clr enabled') = 0
          BEGIN
              PRINT 'Enabling CLR...';
              EXEC sp_configure 'clr enabled', 1;
              RECONFIGURE;
          END

          -- 2. Dynamically instantiate the SSISDB catalog if it is absent
          IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'SSISDB')
          BEGIN
              PRINT 'SSISDB catalog not found. Provisioning fresh integration catalog...';
              EXEC [master].[dbo].[xp_instance_regwrite] N'HKEY_LOCAL_MACHINE', N'SOFTWARE\Microsoft\MSSQLServer\SSISDB', N'ServerRequiresEncryption', REG_DWORD, 1;
              
              DECLARE @catalog_password NVARCHAR(128) = N'Password@123'; 
              EXEC [catalog].[create_catalog] @password = @catalog_password;
              PRINT 'SSISDB Catalog built successfully.';
          END
          ELSE
          BEGIN
              PRINT 'SSISDB Catalog already provisioned on destination.';
          END
          "@

          Write-Host "Connecting over tunnel to target instance ($server) to inspect SSIS catalog status..."
          sqlcmd -b -S $server -U $user -P $pass -d "master" -Q $setupSql
 
      - name: Run Pre-Flight Database Scripts
        shell: powershell
        run: |
          $server = "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}"
          $user   = "${{ secrets.sql_username }}"
          $pass   = "${{ secrets.sql_password }}"
          $db     = "${{ inputs.database }}"
          
          $sqlFiles = @(
            "CreateDatabase.sql",
            "CreateTables.sql",
            "CreateIndexes.sql",
            "CreateStoredProcedure.sql"
          )

          Write-Host "Starting Pre-Flight Database Executions..."
          
          foreach ($file in $sqlFiles) {
            $filePath = "SSIS-Project\Scripts\$file"
            if (Test-Path $filePath) {
              Write-Host "Executing: $file"
              sqlcmd -b -S $server -U $user -P $pass -d $db -i $filePath
            } else {
              throw "Critical pre-flight file missing from workspace: $filePath"
            }
          }
          Write-Host "Pre-flight checks passed successfully."

      - name: 2. Locate/Verify SSIS Project and Deploy ISPAC
        shell: powershell
        run: |
          $server = "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}"
          $user   = "${{ secrets.sql_username }}"
          $pass   = "${{ secrets.sql_password }}"

          # 1. Target the ISPAC file
          $ispacPath = "$env:GITHUB_WORKSPACE\SSIS-Project\TimesheetIntegrationTestTwo\TimesheetIntegrationTestTwo\bin\Development\TimesheetIntegrationTestTwo.ispac"
          if (-not (Test-Path $ispacPath)) {
              throw "Critical Error: Could not locate the .ispac file at expected path: $ispacPath."
          }

          # 2. Dynamically search the standard program directories for the Wizard executable
          Write-Host "Locating ISDeploymentWizard.exe on the runner image..."
          $searchPaths = @("C:\Program Files", "C:\Program Files (x86)")
          $wizardExe = Get-ChildItem -Path $searchPaths -Filter "ISDeploymentWizard.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

          if ($null -eq $wizardExe) {
              throw "Critical Error: ISDeploymentWizard.exe was not found anywhere on the Windows runner image."
          }

          $wizardPath = $wizardExe.FullName
          Write-Host "Found deployment utility at: $wizardPath"

          $destinationProject = "/SSISDB/TimesheetDeployments/TimesheetPackage"
          Write-Host "Deploying bundle to remote SSISDB instance..."

          # 3. Fire the discovered execution path
          & $wizardPath `
              /S `
              /SourceType:Project `
              /SourcePath:"$ispacPath" `
              /DestinationType:SSIS `
              /DestinationServer:"$server" `
              /DestinationPath:"$destinationProject" `
              /AuthType:SQL `
              /UserName:"$user" `
              /Password:"$pass"
              
          Write-Host "SSIS Package successfully shipped and mapped to SSISDB Catalog."

      - name: 3. Provision and Trigger SQL Agent Job Dynamically
        shell: powershell
        run: |
          $server = "${{ vars.SQL_SERVER }},${{ vars.SQL_PORT }}"
          $user   = "${{ secrets.sql_username }}"
          $pass   = "${{ secrets.sql_password }}"

          $jobScriptPath = "$env:GITHUB_WORKSPACE\provision_job.sql"
          
          # T-SQL that dynamically inspects SSISDB to build the correct path
          $provisionJobSql = @"
          USE [msdb];
          SET NOCOUNT ON;
          
          -- 1. Look up the deployed Project and Package names dynamically from the SSIS catalog
          DECLARE @projectName NVARCHAR(255);
          DECLARE @packageName NVARCHAR(255);
          DECLARE @ssisCommand NVARCHAR(4000);

          SELECT TOP 1 
              @projectName = p.name,
              @packageName = pkg.name
          FROM [SSISDB].[catalog].[packages] pkg
          JOIN [SSISDB].[catalog].[projects] p ON pkg.project_id = p.project_id
          JOIN [SSISDB].[catalog].[folders] f ON p.folder_id = f.folder_id
          WHERE f.name = 'TimesheetDeployments'
          ORDER BY p.last_deployment_time DESC;

          -- Fallback names if lookup yields nothing (safeguard)
          IF @projectName IS NULL SET @projectName = 'TimesheetPackage';
          IF @packageName IS NULL SET @packageName = 'Package.dtsx';

          -- Construct the strict local ISSERVER path string
          SET @ssisCommand = N'/ISSERVER "\"\SSISDB\TimesheetDeployments\' + @projectName + '\' + @packageName + '\"" /SERVER "." /ENVREFERENCE 0';

          -- 2. Drop existing job cleanly if it exists
          IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'Run_Timesheet_Package')
          BEGIN
              PRINT 'Stale job configuration found. Dropping old configuration properties...';
              EXEC msdb.dbo.sp_delete_job @job_name = N'Run_Timesheet_Package', @delete_unused_schedule=1;
          END

          PRINT 'Creating fresh automated runtime execution wrapper matching package: ' + @packageName;
          DECLARE @jobId BINARY(16);
          EXEC msdb.dbo.sp_add_job @job_name = N'Run_Timesheet_Package', @enabled = 1, @job_id = @jobId OUTPUT;

          -- 3. Add job step with our dynamically discovered path command
          EXEC msdb.dbo.sp_add_jobstep @job_id = @jobId, @step_name = N'Run Integrated Package Process',
              @subsystem = N'SSIS',
              @command = @ssisCommand,
              @retry_attempts = 0;

          EXEC msdb.dbo.sp_add_jobserver @job_id = @jobId, @server_name = N'(local)';
          
          PRINT 'Executing SQL Agent Job step wrapper...';
          EXEC msdb.dbo.sp_start_job @job_name = N'Run_Timesheet_Package';
          "@

          Set-Content -Path $jobScriptPath -Value $provisionJobSql -Force

          Write-Host "Provisioning fresh target job template execution parameters..."
          sqlcmd -b -S $server -U $user -P $pass -d "msdb" -i $jobScriptPath
 
      - name: Deployment Successful
        if: success()
        shell: powershell
        run: |
          Write-Host "========================================"
          Write-Host "PRE-FLIGHT, PACKAGE DEPLOY, AND SSIS AGENT SIGNALS COMPLETED"
          Write-Host "Environment : ${{ inputs.environment_name }}"
          Write-Host "========================================"