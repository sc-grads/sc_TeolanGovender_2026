name: Reusable Timesheet Deploy Template

on:
  workflow_call:
    inputs:
      database:
        required: true
        type: string
      environment_name:
        required: true
        type: string
    secrets:
      sql_username:
        required: true
      sql_password:
        required: true

jobs:
  deploy:
    name: Deploy
    runs-on: windows-latest
    environment: ${{ inputs.environment_name }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Run Pre-Flight Create Database Script
        run: |
          sqlcmd -S "${{ vars.SQL_SERVER }}" -U "${{ secrets.sql_username }}" -P "${{ secrets.sql_password }}" -i "SSIS-Project/Scripts/CreateDatabase.sql" -b
        shell: pwsh

      - name: 2. Deploy Database Schema Tables
        run: |
          sqlcmd -S "${{ vars.SQL_SERVER }}" -U "${{ secrets.sql_username }}" -P "${{ secrets.sql_password }}" -d "${{ inputs.database }}" -i "SSIS-Project/Scripts/CreateTables.sql" -b
        shell: pwsh

      - name: 3. Deploy Database Indexes
        run: |
          sqlcmd -S "${{ vars.SQL_SERVER }}" -U "${{ secrets.sql_username }}" -P "${{ secrets.sql_password }}" -d "${{ inputs.database }}" -i "SSIS-Project/Scripts/CreateIndexes.sql" -b
        shell: pwsh

      - name: 4. Deploy Stored Procedures (Table Dependency Safe)
        run: |
          sqlcmd -S "${{ vars.SQL_SERVER }}" -U "${{ secrets.sql_username }}" -P "${{ secrets.sql_password }}" -d "${{ inputs.database }}" -i "SSIS-Project/Scripts/CreateStoredProcedure.sql" -b
        shell: pwsh

      - name: 4b. Fix Remote Folder Permissions for SQL Agent Account (Production Only)
        run: |
          if ("${{ inputs.environment_name }}" -eq "production") {
              Write-Host "Production detected. Applying folder permission adjustments..."
              $folderPath = "c:\sc_CharmaneMchunu_2026\SSIS-Project-TG\Timesheets"
              
              if (-not (Test-Path -Path $folderPath)) {
                  Write-Host "Folder structure missing on the runner. Creating directory path..."
                  New-Item -ItemType Directory -Path $folderPath -Force | Out-Null
              }
              
              $agentAccount = "Authenticated Users"
              icacls "${folderPath}\*" /grant "${agentAccount}:(OI)(CI)F" /T
          } else {
              Write-Host "Staging environment detected. Skipping local folder permission modifications."
          }
        shell: pwsh

      - name: 5. Locate Visual Studio DevEnv Tool
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath
          if (-not $vsPath) { $vsPath = & "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath }
          $devenvCom = Join-Path (Split-Path $vsPath) "devenv.com"
          echo "DEVENV_PATH=$devenvCom" | Out-File -FilePath $env:GITHUB_ENV -Append
        shell: pwsh

      - name: 6. Build SSIS Project to ISPAC via DevEnv
        run: |
          & "${{ env.DEVENV_PATH }}" "SSIS-Project\TimesheetIntegrationTestTwo\TimesheetIntegrationTestTwo\TimesheetDevTestMigrationTG.dtproj" /Rebuild "Development"
        shell: pwsh

      - name: 7. Deploy ISPAC via SQL Agent Proxy Bypass
        run: |
          Write-Host "Streaming Compiled ISPAC to local SQL Agent Container..."
          # FIXED: Path updated to match your exact repository structure
          $ispacPath = "SSIS-Project/TimesheetIntegrationTestTwo/TimesheetIntegrationTestTwo/bin/Development/TimesheetDevTestMigrationTG.ispac"
          $fileBytes = [System.IO.File]::ReadAllBytes($ispacPath)
          $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")
          
          $proxyWrapperQuery = @"
          SET NOCOUNT ON;
          
          IF EXISTS (SELECT 1 FROM msdb.dbo.sysjobs WHERE name = N'GitHub_SSIS_Deploy_Helper')
          BEGIN
              EXEC msdb.dbo.sp_delete_job @job_name = N'GitHub_SSIS_Deploy_Helper', @delete_unused_schedule = 1;
          END
          
          DECLARE @jobId BINARY(16);
          EXEC msdb.dbo.sp_add_job @job_name = N'GitHub_SSIS_Deploy_Helper', @enabled = 1, @job_id = @jobId OUTPUT;
          
          DECLARE @catalogFolder NVARCHAR(100) = N'${{ inputs.environment_name == 'production' && 'TimesheetProductionMigration' || 'TimesheetDevTestMigration' }}';
          DECLARE @projectName NVARCHAR(100) = N'${{ inputs.environment_name == 'production' && 'TimesheetProductionMigrationTG' || 'TimesheetDevTestMigrationTG' }}';

          DECLARE @dynamic_tsql NVARCHAR(MAX);
          SET @dynamic_tsql = N'
          SET NOCOUNT ON;
          IF NOT EXISTS (SELECT 1 FROM [SSISDB].[catalog].[folders] WHERE name = ''' + @catalogFolder + ''') 
          BEGIN 
              EXEC [SSISDB].[catalog].[create_folder] @folder_name = ''' + @catalogFolder + '''; 
          END
          
          DECLARE @project_binary VARBINARY(MAX) = $hexString;
          EXEC [SSISDB].[catalog].[deploy_project] @folder_name = ''' + @catalogFolder + ''', @project_name = ''' + @projectName + ''', @project_stream = @project_binary;
          ';
          
          EXEC msdb.dbo.sp_add_jobstep @job_name = N'GitHub_SSIS_Deploy_Helper', @step_name = N'Run_ISPAC_Deploy', @step_id = 1, @subsystem = N'TSQL', @command = @dynamic_tsql;
          EXEC msdb.dbo.sp_add_jobserver @job_name = N'GitHub_SSIS_Deploy_Helper', @server_name = N'(local)';
          EXEC msdb.dbo.sp_start_job @job_name = N'GitHub_SSIS_Deploy_Helper';
          WAITFOR DELAY '00:00:05';
          "@
          
          $tempSqlFile = Join-Path $env:RUNNER_TEMP "RunProxyDeploy.sql"
          $proxyWrapperQuery | Out-File -FilePath $tempSqlFile -Encoding utf8 -Force
          
          sqlcmd -S "${{ vars.SQL_SERVER }}" -U "${{ secrets.sql_username }}" -P "${{ secrets.sql_password }}" -i $tempSqlFile -b -C
        shell: pwsh

      - name: 8. Provision 30-Second Scheduled Execution Job
        run: |
          if ("${{ inputs.environment_name }}" -eq "production") {
              $jobName = "RunTimesheetProductionMigrationTG"
              $catalogFolder = "TimesheetProductionMigration"
              $projectName = "TimesheetProductionMigrationTG"
          } else {
              $jobName = "RunTimesheetDevTestMigrationTG"
              $catalogFolder = "TimesheetDevTestMigration"
              $projectName = "TimesheetDevTestMigrationTG"
          }

          Write-Host "Piping job setup matrix over tunnel for Job Name: $jobName"

          sqlcmd -S "${{ vars.SQL_SERVER }}" -U "${{ secrets.sql_username }}" -P "${{ secrets.sql_password }}" -d msdb -i "SSIS-Project/Scripts/ProvisionJob.sql" -b -v TARGET_JOB_NAME="$jobName" CATALOG_FOLDER="$catalogFolder" PROJECT_NAME="$projectName"
        shell: pwsh

      - name: 9. Override SSIS Project Parameters for Target Environment
        run: |
          if ("${{ inputs.environment_name }}" -eq "production") {
              $targetPath = "c:\sc_CharmaneMchunu_2026\SSIS-Project-TG\Timesheets\"
              $catalogFolder = "TimesheetProductionMigration"
          } else {
              $targetPath = "C:\sc_TeolanGovender_2026\SSIS-Project\Timesheets\"
              $catalogFolder = "TimesheetDevTestMigration"
          }
          
          Write-Host "Applying runtime path override to folder ${catalogFolder}: ${targetPath}"
          
          $overrideQuery = @"
          USE SSISDB;
          UPDATE object_parameters
          SET 
              design_default_value = N'$targetPath',
              default_value = N'$targetPath'
          FROM catalog.object_parameters object_parameters
          INNER JOIN catalog.projects p ON object_parameters.project_id = p.project_id
          INNER JOIN catalog.folders f ON p.folder_id = f.folder_id
          WHERE f.name = N'$catalogFolder'
            AND object_parameters.parameter_name = N'Source_File_Directory';
          "@
          
          $tempSqlFile = Join-Path $env:RUNNER_TEMP "OverrideParams.sql"
          $overrideQuery | Out-File -FilePath $tempSqlFile -Encoding utf8 -Force
          
          sqlcmd -S "${{ vars.SQL_SERVER }}" -U "${{ secrets.sql_username }}" -P "${{ secrets.sql_password }}" -i $tempSqlFile -b
        shell: pwsh